<!DOCTYPE html>
<html lang="en" class="transition-colors duration-300 ease-in-out">
<head>
  <meta charset="UTF-8">
  <title>Freshworks Style Landing Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-white text-gray-800 dark:bg-gray-900 dark:text-white transition-colors duration-300 ease-in-out">

  <!-- Navbar -->
  <header class="flex justify-between items-center p-6 shadow-md">
    <h1 class="text-xl font-bold text-green-600 dark:text-green-400">freshworks</h1>
  </header>

  <!-- Main Section -->
  <section class="flex flex-col lg:flex-row p-10 gap-10">
    <!-- Left Content -->
    <div class="lg:w-1/2">
      <h2 class="text-4xl font-bold mb-4">A fresh approach to omnichannel for 2025</h2>
      <p class="text-lg mb-6">Your guide to overcoming barriers to omnichannel success...</p>
      <img src="assets/images/hero.webp" alt="hero" class="rounded-xl shadow-md">
    </div>

    <!-- Right Form -->
    <div class="lg:w-1/2 bg-gray-100 dark:bg-gray-800 p-8 rounded-xl shadow-md">
      <h3 class="text-xl font-semibold mb-4">Submit your details</h3>
      <form id="contact-form" class="space-y-4">
        <!-- First Name and Last Name -->
        <div class="flex gap-4">
          <div class="w-1/2">
            <label for="first_name" class="text-sm">First name *</label>
            <input type="text" name="first_name" id="first_name" placeholder="First name *"
              class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600" required>
          </div>
          <div class="w-1/2">
            <label for="last_name" class="text-sm">Last name *</label>
            <input type="text" name="last_name" id="last_name" placeholder="Last name *"
              class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600" required>
          </div>
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="text-sm">Business email *</label>
          <input type="email" name="email" id="email" placeholder="Business email *"
            class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600" required>
        </div>

        <!-- Company Name -->
        <div>
          <label for="company" class="text-sm">Company name *</label>
          <input type="text" name="company" id="company" placeholder="Company name *"
            class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600" required>
        </div>

        <!-- Phone Number -->
        <div>
          <label for="phone" class="text-sm">Phone</label>
          <input type="tel" name="phone" id="phone" placeholder="Phone"
            class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
        </div>

        <!-- Submit Button -->
        <button type="submit"
          class="bg-purple-600 hover:bg-purple-700 transition text-white px-6 py-2 rounded w-full">
          Submit
        </button>
      </form>
    </div>
  </section>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script type="module" src="/assets/js/script.js"></script>
</body>
</html>
